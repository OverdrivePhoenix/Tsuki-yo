server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: prefetch-backend
  main:
    allow-bean-definition-overriding: true

# PreFetch Configuration
prefetch:
  firebase:
    # Path to local serviceAccountKey.json or set FIREBASE_CREDENTIALS_JSON in env
    credentials-path: ${FIREBASE_CONFIG_PATH:classpath:serviceAccountKey.json}
    project-id: ${FIREBASE_PROJECT_ID:prefetch-campus}
  merchant:
    upi-id: ${MERCHANT_UPI_ID:marian.coop@okaxis}
    name: ${MERCHANT_NAME:Marian Co-Operative Store}
    counter-desk: Station 01 Bay 02
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "https://prefetch-campus.vercel.app"
      - "https://*.vercel.app"

logging:
  level:
    root: INFO
    com.prefetch: DEBUG
    org.springframework.security: INFO
